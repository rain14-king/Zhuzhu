<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Hug</title>
  <style>
    :root {
      --bg-start: #ffe4ec;
      --bg-end: #ffd6a5;
      --card: #fff7fb;
      --text: #4b2e39;
      --button: #ff7aa2;
      --button-hover: #ff5d8d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
    }

    .card {
      width: min(92vw, 520px);
      padding: 1.25rem;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 12px 28px rgba(100, 36, 63, 0.16);
      text-align: center;
    }

    img {
      width: 100%;
      max-width: 480px;
      height: auto;
      display: block;
      margin: 0;
      border-radius: 14px;
    }

    button {
      margin-top: 1rem;
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1.2rem;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--button);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background: var(--button-hover);
    }

    p {
      margin: 0.9rem 0 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="Virtual-Hug.jpg" alt="Virtual hug" />
    <button id="revealButton" type="button">点我</button>
    <p id="message" class="hidden">无聊的话给我打电话</p>
  </main>
  <script>
    const revealButton = document.getElementById("revealButton");
    const message = document.getElementById("message");

    revealButton.addEventListener("click", () => {
      message.classList.toggle("hidden");
    });
  </script>
</body>
</html>
