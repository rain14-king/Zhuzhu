<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不准！</title>
  <style>
    :root {
      --bg-start: #fef08a;
      --bg-end: #fca5a5;
      --text: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg-start), var(--bg-end));
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <h1>不准！</h1>
</body>
</html>
