<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TongTong YUYU Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --bg-soft: #121212;
      --ink: #efefef;
      --ink-muted: #afafaf;
      --line: rgba(255, 255, 255, 0.2);
      --line-strong: rgba(255, 255, 255, 0.36);
      --accent: #d8ba88;
      --accent-strong: #edd4a9;
      --panel: rgba(10, 10, 10, 0.72);
      --panel-strong: rgba(8, 8, 8, 0.86);
      --shadow: 0 24px 56px rgba(0, 0, 0, 0.52);
      --mono: "Comfortaa", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --display: "ZCOOL KuaiLe", "HanziPen SC", "Marker Felt", cursive;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: var(--mono);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body.initial-state,
    body.awaiting-scene {
      cursor: pointer;
    }

    body.planner-hidden .planner-wrap,
    body.planner-hidden .planner-backdrop {
      opacity: 0;
      pointer-events: none;
    }

    body.planner-hidden .planner-wrap {
      transform: translate(-50%, -50%) scale(0.92);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: #00000c;
      overflow: hidden;
    }

    body.initial-state .site-logo,
    body.initial-state .utility-controls,
    body.initial-state .planner-toggle-button,
    body.initial-state .content-shell,
    body.initial-state .music-status,
    body.initial-state .planner-wrap {
      opacity: 0;
      pointer-events: none;
    }

    body.awaiting-scene .content-shell {
      opacity: 0;
      pointer-events: none;
    }

    #sky,
    .vignette-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #sky {
      display: block;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .vignette-layer {
      background: radial-gradient(circle at 50% 46%, transparent 34%, rgba(0, 0, 0, 0.78) 100%);
      z-index: 1;
    }

    .planner-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 4, 12, 0.5);
      backdrop-filter: blur(2px);
      z-index: 6;
      transition: opacity 220ms ease;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 1.2rem;
      transform: translateX(-50%) translateY(-14px);
      min-width: min(88vw, 280px);
      max-width: min(92vw, 520px);
      padding: 0.62rem 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 999px;
      background: rgba(6, 12, 34, 0.86);
      color: #f7fbff;
      font-family: var(--mono);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: none;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 0 0 18px rgba(138, 189, 255, 0.24);
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.toast-warn {
      border-color: rgba(255, 236, 189, 0.9);
      background: rgba(40, 16, 28, 0.94);
      color: #fff4d9;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.5), 0 0 26px rgba(255, 211, 135, 0.48);
      font-size: 1rem;
      letter-spacing: 0.09em;
      font-weight: 700;
      animation: toast-warn-pulse 520ms ease;
    }

    @keyframes toast-warn-pulse {
      0% {
        transform: translateX(-50%) translateY(-10px) scale(0.94);
      }

      45% {
        transform: translateX(-50%) translateY(0) scale(1.04);
      }

      100% {
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .site-logo {
      position: fixed;
      top: clamp(1rem, 2.5vw, 1.8rem);
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-family: var(--display);
      font-size: clamp(1.45rem, 2.8vw, 2.55rem);
      letter-spacing: 0.26em;
      text-shadow: 0 5px 18px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .site-sub {
      display: block;
      margin-top: 0.32rem;
      font-family: var(--mono);
      font-size: clamp(0.53rem, 1vw, 0.7rem);
      letter-spacing: 0.22em;
      opacity: 0.86;
      text-align: center;
    }

    .utility-controls {
      position: fixed;
      right: clamp(0.8rem, 2vw, 1.3rem);
      top: clamp(0.8rem, 2.2vw, 1.2rem);
      display: flex;
      gap: 0.45rem;
      z-index: 5;
    }

    .util-button {
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.48);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.5rem 0.72rem;
      cursor: pointer;
      transition: border-color 200ms ease, background-color 200ms ease, color 200ms ease;
    }

    .util-button:hover,
    .util-button:focus-visible {
      outline: none;
      border-color: var(--line-strong);
      background: rgba(20, 20, 20, 0.78);
      color: var(--accent-strong);
    }

    .planner-toggle-button {
      position: fixed;
      left: 50%;
      bottom: clamp(0.95rem, 2.3vw, 1.55rem);
      width: clamp(96px, 11vw, 132px);
      height: clamp(42px, 5.2vw, 56px);
      transform: translateX(-50%);
      z-index: 7;
      border: 2px solid rgba(250, 252, 255, 0.9);
      border-radius: 999px;
      background: transparent;
      color: rgba(248, 251, 255, 0.95);
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1.1;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.24), 0 0 18px rgba(170, 205, 255, 0.2);
      overflow: visible;
      transition: transform 180ms ease, box-shadow 180ms ease, color 180ms ease;
    }

    .planner-toggle-button::before,
    .planner-toggle-button::after {
      content: "";
      position: absolute;
      inset: -3px;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      pointer-events: none;
    }

    .planner-toggle-button::before {
      transform: rotate(-2.6deg);
      opacity: 0.75;
    }

    .planner-toggle-button::after {
      inset: -5px;
      transform: rotate(2.2deg);
      opacity: 0.45;
    }

    .planner-toggle-button:hover,
    .planner-toggle-button:focus-visible {
      outline: none;
      transform: translateX(-50%) translateY(-1px);
      color: #ffffff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 26px rgba(197, 225, 255, 0.35);
    }

    .content-shell {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .photo-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .popped-photo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 220px;
      height: auto;
      border: 1px solid rgba(255, 255, 255, 0.38);
      background: rgba(8, 10, 22, 0.84);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.55);
      opacity: 0;
      filter: blur(10px) brightness(1.35);
      transform: translate(-50%, -50%) scale(0.52) rotate(var(--rot, 0deg));
      transition: opacity 220ms ease;
    }

    .popped-photo.is-visible {
      opacity: 1;
      animation: photo-pop var(--appearDur, 420ms) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes photo-pop {
      0% {
        filter: blur(10px) brightness(1.35);
        transform: translate(-50%, -50%) scale(0.52) rotate(var(--rot, 0deg));
      }

      68% {
        filter: blur(0) brightness(1.08);
        transform: translate(-50%, -50%) scale(1.06) rotate(var(--rot, 0deg));
      }

      100% {
        filter: blur(0) brightness(1);
        transform: translate(-50%, -50%) scale(1) rotate(var(--rot, 0deg));
      }
    }

    .click-star {
      position: fixed;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      color: #f8fbff;
      font-size: 16px;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(170, 215, 255, 0.9);
      z-index: 34;
      animation: click-star-pop var(--dur, 820ms) cubic-bezier(0.16, 0.8, 0.2, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes click-star-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.36) rotate(0deg);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px))) scale(0.15) rotate(var(--rot, 40deg));
      }
    }

    .image-frame {
      display: none;
    }

    .image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: none;
      z-index: 2;
    }

    .hug-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.82) contrast(1.06) brightness(0.92);
      transition: transform 500ms cubic-bezier(0.2, 0.75, 0.2, 1), opacity 300ms ease;
    }

    .image-frame.is-transitioning .hug-image {
      opacity: 0.62;
      transform: scale(1.045);
    }

    .image-meta {
      position: absolute;
      left: 0.72rem;
      right: 0.72rem;
      bottom: 0.72rem;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.63rem;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    .stage-hint {
      opacity: 0.7;
    }

    .music-status {
      position: fixed;
      left: clamp(0.8rem, 1.8vw, 1.4rem);
      bottom: clamp(0.85rem, 2.2vw, 1.35rem);
      z-index: 5;
      font-size: 0.62rem;
      letter-spacing: 0.11em;
      color: var(--ink-muted);
      max-width: min(40ch, 58vw);
      line-height: 1.4;
    }

    .planner-wrap {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 7;
      width: min(96vw, 860px);
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(5px);
      box-shadow: var(--shadow);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .planner-wrap.shake {
      animation: modal-shake 420ms ease;
    }

    @keyframes modal-shake {
      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
      }

      18% {
        transform: translate(calc(-50% - 8px), -50%) scale(1.01);
      }

      38% {
        transform: translate(calc(-50% + 8px), -50%) scale(1.01);
      }

      56% {
        transform: translate(calc(-50% - 6px), -50%) scale(1.005);
      }

      74% {
        transform: translate(calc(-50% + 6px), -50%) scale(1.005);
      }
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.82);
      z-index: 20;
      opacity: 1;
      transition: opacity 220ms ease;
    }

    .video-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .kiss-video {
      width: min(94vw, 780px);
      max-height: 88vh;
      border: 1px solid rgba(255, 255, 255, 0.34);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    .video-close {
      position: absolute;
      top: clamp(0.9rem, 2.2vw, 1.2rem);
      right: clamp(0.9rem, 2.2vw, 1.2rem);
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.45rem 0.7rem;
      cursor: pointer;
    }

    .video-close:hover,
    .video-close:focus-visible {
      outline: none;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.65);
    }

    .planner-title {
      margin: 0;
      padding: 0.88rem 0.7rem 0.3rem;
      text-align: center;
      font-family: var(--display);
      font-size: clamp(1.25rem, 2.3vw, 1.9rem);
      letter-spacing: 0.06em;
      text-transform: none;
      color: #f7fbff;
      text-shadow: 0 4px 14px rgba(128, 184, 255, 0.35);
    }

    .planner-form {
      display: grid;
      grid-template-columns: 1fr 1.25fr auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.58rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      min-width: 0;
    }

    .field-label {
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .field input {
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.5);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.67rem;
      letter-spacing: 0.08em;
      min-height: 2.05rem;
      padding: 0.4rem 0.52rem;
      width: 100%;
    }

    .field input:focus-visible {
      outline: none;
      border-color: var(--accent);
    }

    .submit-button {
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      min-height: 2.05rem;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      outline: none;
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-strong);
      color: var(--accent-strong);
    }

    .planner-feedback {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.7rem;
      padding: 0.42rem 0.58rem 0.52rem;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
      min-height: 1.95rem;
    }

    .planner-feedback strong {
      color: var(--accent-strong);
      font-weight: 400;
    }

    @media (max-width: 820px) {
      .image-frame {
        width: min(92vw, 680px);
      }

      .planner-wrap {
        width: min(96vw, 680px);
      }

      .planner-form {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      body {
        overflow: auto;
      }

      .site-logo {
        letter-spacing: 0.16em;
      }

      .content-shell {
        position: fixed;
      }

      .image-frame {
        width: 100%;
      }

      .music-status {
        left: 0.8rem;
        bottom: 12.2rem;
        max-width: calc(100vw - 1.6rem);
      }

      .planner-toggle-button {
        bottom: 1.05rem;
      }

      .planner-wrap {
        width: calc(100vw - 1.1rem);
        max-height: calc(100vh - 5.5rem);
        overflow: auto;
      }

      .planner-form {
        grid-template-columns: 1fr;
      }

      .submit-button {
        width: 100%;
      }

      .planner-feedback {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.28rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hug-image,
      .util-button,
      .planner-toggle-button,
      .submit-button {
        transition: none;
        animation: none;
      }

      .planner-wrap,
      .planner-backdrop,
      .video-overlay,
      .toast {
        transition: none;
      }

      .click-star {
        animation: none;
      }
    }
  </style>
</head>
<body class="initial-state planner-hidden">
  <div class="stage">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="vignette-layer" aria-hidden="true"></div>
  </div>

  <div id="plannerBackdrop" class="planner-backdrop" aria-hidden="true"></div>
  <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>

  <header class="site-logo">
    TONGTONG YUYU HOME
    <span class="site-sub">Maomao & Xiaopengyou EDITION</span>
  </header>

  <div class="utility-controls">
    <button id="musicButton" class="util-button" type="button" aria-pressed="false">Play Music</button>
  </div>

  <button id="plannerToggle" class="planner-toggle-button" type="button" aria-expanded="false">Plan</button>

  <main class="content-shell">
    <div id="photoLayer" class="photo-layer" aria-hidden="true"></div>
  </main>

  <div id="musicStatus" class="music-status" aria-live="polite">Volume down first or use headphones.</div>

  <section class="planner-wrap" aria-label="Date planner">
    <h2 class="planner-title">请选择和大猪的约会！</h2>
    <form id="plannerForm" class="planner-form">
      <label class="field" for="dateInput">
        <span class="field-label">Pick a Date</span>
        <input id="dateInput" name="date" type="date" required />
      </label>
      <label class="field" for="activityInput">
        <span class="field-label">Date Activity</span>
        <input id="activityInput" name="activity" type="text" maxlength="80" placeholder="Dinner, movie, walk..." required />
      </label>
      <button type="submit" class="submit-button">Submit Plan</button>
    </form>
    <div class="planner-feedback">
      <span id="planStatus">No plan submitted yet.</span>
      <span id="lastPlan">Last: --</span>
    </div>
  </section>

  <audio id="bgm" src="./bgm.mp3" loop preload="auto"></audio>

  <div id="videoOverlay" class="video-overlay hidden" aria-hidden="true">
    <button id="videoClose" class="video-close" type="button">Close</button>
    <video id="kissVideo" class="kiss-video" src="./BankKiss.MOV" playsinline controls preload="metadata"></video>
  </div>

  <script>
    const musicButton = document.getElementById("musicButton");
    const plannerToggle = document.getElementById("plannerToggle");
    const plannerBackdrop = document.getElementById("plannerBackdrop");
    const toast = document.getElementById("toast");
    const videoOverlay = document.getElementById("videoOverlay");
    const videoClose = document.getElementById("videoClose");
    const kissVideo = document.getElementById("kissVideo");
    const skyCanvas = document.getElementById("sky");
    const skyCtx = skyCanvas.getContext("2d");
    const photoLayer = document.getElementById("photoLayer");
    const musicStatus = document.getElementById("musicStatus");
    const bgm = document.getElementById("bgm");

    const plannerForm = document.getElementById("plannerForm");
    const plannerWrap = document.querySelector(".planner-wrap");
    const dateInput = document.getElementById("dateInput");
    const activityInput = document.getElementById("activityInput");
    const planStatus = document.getElementById("planStatus");
    const lastPlan = document.getElementById("lastPlan");

    const imageLoop = [
      { src: "./Memory/Pigs.jpeg", alt: "Pigs cuddle" },
      { src: "./Memory/Pigs2.heic", alt: "Pigs cuddle scene two" },
      { src: "./Memory/Pigs3.jpeg", alt: "Pigs on train" },
      { src: "./Memory/Pigs4.jpeg", alt: "Pigs at night" },
      { src: "./Memory/Pigs5.heic", alt: "Pigs in activity room" },
      { src: "./Memory/Maomao.jpg", alt: "Maomao" },
      { src: "./Memory/Maomao0.JPG", alt: "Maomao 0" },
      { src: "./Memory/Maomao1.JPG", alt: "Maomao 1" },
      { src: "./Memory/Maomao2.JPG", alt: "Maomao 2" },
      { src: "./Memory/Maomao3.JPG", alt: "Maomao 3" },
      { src: "./Memory/Maomao4.JPG", alt: "Maomao 4" },
      { src: "./Memory/Maomao5.JPG", alt: "Maomao 5" },
      { src: "./Memory/Maomao6.JPG", alt: "Maomao 6" },
      { src: "./Memory/Maomao7.JPG", alt: "Maomao 7" },
      { src: "./Memory/Maomao8.JPG", alt: "Maomao 8" },
      { src: "./Memory/Maomao9.JPG", alt: "Maomao 9" },
      { src: "./Memory/Dazhuxiaozhu.HEIC", alt: "Dazhuxiaozhu" },
      { src: "./Memory/Dazhuxiaozhu1.JPG", alt: "Dazhuxiaozhu 1" },
      { src: "./Memory/Dazhuxiaozhu2.JPG", alt: "Dazhuxiaozhu 2" },
      { src: "./Memory/Dazhuxiaozhu3.JPG", alt: "Dazhuxiaozhu 3" },
      { src: "./Memory/Dazhuxiaozhu4.HEIC", alt: "Dazhuxiaozhu 4" },
      { src: "./Memory/Dazhuxiaozhu5.JPG", alt: "Dazhuxiaozhu 5" }
    ];

    const plannerStorageKey = "datePlans";
    const formSubmitEndpoint = "https://formspree.io/f/mjybjygl";
    let imageIndex = -1;
    let photoStackIndex = 1;
    let stageClickCount = 0;
    let hasShownCloseHint = false;
    let toastTimer = null;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let skyWidth = 0;
    let skyHeight = 0;
    let stars = [];

    bgm.volume = 0.35;

    function createStars() {
      stars = Array.from({ length: 200 }, () => ({
        x: Math.random() * skyWidth,
        y: Math.random() * skyHeight,
        radius: Math.random() * 1.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02
      }));
    }

    function resizeSky() {
      skyWidth = skyCanvas.width = window.innerWidth;
      skyHeight = skyCanvas.height = window.innerHeight;
      createStars();
    }

    class ShootingStar {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * skyWidth * 1.5;
        this.y = 0;
        this.len = Math.random() * 80 + 50;
        this.speed = Math.random() * 10 + 6;
        this.angle = Math.PI / 4;
        this.opacity = 0;
        this.wait = Math.floor(Math.random() * 180) + 20;
      }

      update() {
        if (this.wait > 0) {
          this.wait -= 1;
          if (this.wait === 0) {
            this.opacity = 1;
          }
          return;
        }

        this.x -= this.speed * Math.cos(this.angle);
        this.y += this.speed * Math.sin(this.angle);
        this.opacity -= 0.01;

        if (this.opacity <= 0 || this.y > skyHeight || this.x < 0) {
          this.reset();
        }
      }

      draw() {
        if (this.opacity <= 0) {
          return;
        }

        skyCtx.save();
        skyCtx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
        skyCtx.lineWidth = 2;
        skyCtx.beginPath();
        skyCtx.moveTo(this.x, this.y);
        skyCtx.lineTo(
          this.x + this.len * Math.cos(this.angle),
          this.y - this.len * Math.sin(this.angle)
        );
        skyCtx.stroke();
        skyCtx.restore();
      }
    }

    const shootingStars = Array.from({ length: 3 }, () => new ShootingStar());

    function animateSky() {
      skyCtx.clearRect(0, 0, skyWidth, skyHeight);

      stars.forEach((star) => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) {
          star.speed = -star.speed;
        }

        skyCtx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        skyCtx.beginPath();
        skyCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        skyCtx.fill();
      });

      if (!reduceMotion) {
        shootingStars.forEach((star) => {
          star.update();
          star.draw();
        });
      }

      requestAnimationFrame(animateSky);
    }

    function popRandomPhoto() {
      imageIndex = (imageIndex + 1) % imageLoop.length;
      const scene = imageLoop[imageIndex];
      const photo = document.createElement("img");
      const minWidth = 130;
      const maxWidth = Math.min(360, Math.max(190, window.innerWidth * 0.36));
      const width = minWidth + Math.random() * (maxWidth - minWidth);
      const x = width / 2 + Math.random() * Math.max(1, window.innerWidth - width);
      const y = width / 2 + Math.random() * Math.max(1, window.innerHeight - width);
      const rotation = -18 + Math.random() * 36;

      photo.className = "popped-photo";
      photo.src = scene.src;
      photo.alt = scene.alt;
      photo.style.width = `${width}px`;
      photo.style.left = `${x}px`;
      photo.style.top = `${y}px`;
      photo.style.setProperty("--rot", `${rotation}deg`);
      photo.style.setProperty("--appearDur", `${340 + Math.random() * 260}ms`);
      photo.style.zIndex = String(20 + photoStackIndex);
      photoStackIndex += 1;

      photoLayer.appendChild(photo);
      requestAnimationFrame(() => {
        photo.classList.add("is-visible");
      });

      const photos = photoLayer.querySelectorAll(".popped-photo");
      const maxPhotosOnScreen = 14;
      if (photos.length > maxPhotosOnScreen) {
        const oldest = photos[0];
        oldest.classList.remove("is-visible");
        setTimeout(() => {
          oldest.remove();
        }, 220);
      }
    }

    function updateMusicState(isPlaying) {
      musicButton.textContent = isPlaying ? "Pause Music" : "Play Music";
      musicButton.setAttribute("aria-pressed", String(isPlaying));
      musicStatus.textContent = isPlaying ? "Now playing: 早到的U.mp3" : "Music paused.";
    }

    async function toggleMusic() {
      if (bgm.paused) {
        try {
          await bgm.play();
          updateMusicState(true);
        } catch (error) {
          updateMusicState(false);
          musicStatus.textContent = "Playback blocked. Tap again to allow audio.";
        }
      } else {
        bgm.pause();
        updateMusicState(false);
      }
    }

    function readPlans() {
      const raw = localStorage.getItem(plannerStorageKey);
      if (!raw) {
        return [];
      }

      try {
        const plans = JSON.parse(raw);
        return Array.isArray(plans) ? plans : [];
      } catch (error) {
        return [];
      }
    }

    function writePlans(plans) {
      localStorage.setItem(plannerStorageKey, JSON.stringify(plans));
    }

    function renderLastPlan() {
      const plans = readPlans();
      if (plans.length === 0) {
        lastPlan.textContent = "Last: --";
        return;
      }

      const recent = plans[plans.length - 1];
      lastPlan.textContent = `Last: ${recent.date} / ${recent.activity}`;
    }

    function showToast(message, type = "info", duration = 1800) {
      if (!toast) {
        return;
      }

      toast.textContent = message;
      toast.classList.remove("toast-warn");
      if (type === "warn") {
        toast.classList.add("toast-warn");
      }
      toast.classList.add("show");

      if (toastTimer) {
        clearTimeout(toastTimer);
      }

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, duration);
    }

    function shakePlanner() {
      if (!plannerWrap || reduceMotion) {
        return;
      }

      plannerWrap.classList.remove("shake");
      void plannerWrap.offsetWidth;
      plannerWrap.classList.add("shake");
    }

    async function sendPlanRemotely(plan) {
      if (!formSubmitEndpoint) {
        return { sent: false, reason: "not_configured" };
      }

      const payload = {
        date: plan.date,
        activity: plan.activity,
        source: "TongTong YUYU Home",
        message: `你和大猪的约会将在 ${plan.date} 大猪小猪一块去 ${plan.activity}.`
      };

      const response = await fetch(formSubmitEndpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("Remote submit failed");
      }

      return { sent: true };
    }

    async function submitPlan(event) {
      event.preventDefault();

      const selectedDate = dateInput.value;
      const activity = activityInput.value.trim();

      if (!selectedDate) {
        planStatus.textContent = "必须选！";
        showToast("必须选！", "warn", 2200);
        return;
      }

      if (!activity) {
        planStatus.textContent = "必须选！";
        showToast("必须选！", "warn", 2200);
        return;
      }

      const plans = readPlans();
      plans.push({
        date: selectedDate,
        activity,
        createdAt: new Date().toISOString()
      });
      writePlans(plans);

      let remoteText = "Saved locally.";

      try {
        const remoteResult = await sendPlanRemotely({ date: selectedDate, activity });
        if (remoteResult.sent) {
          remoteText = "Saved and sent to your response inbox.";
        } else if (remoteResult.reason === "not_configured") {
          remoteText = "Saved locally. Add endpoint to receive others' responses.";
        }
      } catch (error) {
        remoteText = "Saved locally. Network send failed.";
      }

      planStatus.innerHTML = `Saved <strong>${activity}</strong> on <strong>${selectedDate}</strong>. ${remoteText}`;
      showToast(`你和大猪的约会将在 ${selectedDate} 大猪小猪一块去 ${activity}.`);
      showVideoOverlay();

      renderLastPlan();
      activityInput.value = "";
      activityInput.focus();
    }

    function showVideoOverlay() {
      videoOverlay.classList.remove("hidden");
      videoOverlay.setAttribute("aria-hidden", "false");
      kissVideo.currentTime = 0;

      const playPromise = kissVideo.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => {
          planStatus.textContent = "Video blocked by browser. Press play in the video panel.";
        });
      }
    }

    function hideVideoOverlay() {
      videoOverlay.classList.add("hidden");
      videoOverlay.setAttribute("aria-hidden", "true");
      kissVideo.pause();
    }

    function togglePlanner() {
      const isCurrentlyHidden = document.body.classList.contains("planner-hidden");

      if (!isCurrentlyHidden && !hasShownCloseHint) {
        hasShownCloseHint = true;
        showToast("必须选！", "warn", 2200);
        shakePlanner();
        return;
      }

      document.body.classList.toggle("planner-hidden");
      const isOpen = !document.body.classList.contains("planner-hidden");
      plannerToggle.textContent = isOpen ? "Close" : "Plan";
      plannerToggle.setAttribute("aria-expanded", String(isOpen));
      plannerBackdrop.setAttribute("aria-hidden", String(!isOpen));
    }

    function closePlanner() {
      if (document.body.classList.contains("planner-hidden")) {
        return;
      }

      if (!hasShownCloseHint) {
        hasShownCloseHint = true;
        showToast("必须选！", "warn", 2200);
        shakePlanner();
        return;
      }

      document.body.classList.add("planner-hidden");
      plannerToggle.textContent = "Plan";
      plannerToggle.setAttribute("aria-expanded", "false");
      plannerBackdrop.setAttribute("aria-hidden", "true");
    }

    function runStageSequence() {
      stageClickCount += 1;

      if (stageClickCount === 1) {
        document.body.classList.remove("initial-state");
        document.body.classList.add("awaiting-scene");

        if (bgm.paused) {
          toggleMusic();
        }

        musicStatus.textContent = "Music started. Tap background again to show a picture.";
        return;
      }

      if (document.body.classList.contains("awaiting-scene")) {
        document.body.classList.remove("awaiting-scene");
      }

      popRandomPhoto();
    }

    function handleBackgroundClick(event) {
      const target = event.target;
      if (!(target instanceof Element)) {
        return;
      }

      if (target.closest(".planner-wrap") || target.closest(".util-button") || target.closest("#plannerToggle")) {
        return;
      }

      runStageSequence();
    }

    function spawnClickStars(x, y) {
      if (reduceMotion) {
        return;
      }

      const starCount = 8;
      for (let i = 0; i < starCount; i += 1) {
        const star = document.createElement("span");
        const angle = (Math.PI * 2 * i) / starCount + Math.random() * 0.28;
        const distance = 16 + Math.random() * 34;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        star.className = "click-star";
        star.textContent = Math.random() > 0.4 ? "✦" : "✧";
        star.style.left = `${x}px`;
        star.style.top = `${y}px`;
        star.style.setProperty("--dx", `${dx}px`);
        star.style.setProperty("--dy", `${dy}px`);
        star.style.setProperty("--rot", `${-35 + Math.random() * 70}deg`);
        star.style.setProperty("--dur", `${620 + Math.random() * 380}ms`);
        star.style.fontSize = `${12 + Math.random() * 10}px`;

        document.body.appendChild(star);
        setTimeout(() => {
          star.remove();
        }, 1050);
      }
    }

    function handleClickSpark(event) {
      spawnClickStars(event.clientX, event.clientY);
    }

    musicButton.addEventListener("click", toggleMusic);
    plannerToggle.addEventListener("click", togglePlanner);
    plannerBackdrop.addEventListener("click", closePlanner);
    document.addEventListener("click", handleBackgroundClick);
    document.addEventListener("click", handleClickSpark);
    window.addEventListener("resize", resizeSky);
    videoClose.addEventListener("click", hideVideoOverlay);

    videoOverlay.addEventListener("click", (event) => {
      if (event.target === videoOverlay) {
        hideVideoOverlay();
      }
    });

    plannerForm.addEventListener("submit", submitPlan);

    bgm.addEventListener("ended", () => {
      updateMusicState(false);
    });

    renderLastPlan();
    resizeSky();
    animateSky();
  </script>
</body>
</html>
